services:
  monitored_host:
    image: nginx:latest
    container_name: monitored_host
    volumes:
      - ./logs/nginx:/var/log/nginx
      - ./nginx/custom_real_ip.conf:/etc/nginx/conf.d/custom_real_ip.conf:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/html:/usr/share/nginx/html:ro
    ports:
      - "8080:80"
    depends_on:
      - kafka
    networks:
      - monitored_net

  ssh_server:
    image: lscr.io/linuxserver/openssh-server:latest
    container_name: ssh_server
    # This acts as a honeypot/vulnerable service to demonstrate TCP-layer 
    # brute force detection (since SSH payloads are encrypted).
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - USER_NAME=admin
      - USER_PASSWORD=secretpassword
      - PASSWORD_ACCESS=true
    volumes:
      - ./logs/ssh:/config/logs
      # We mount a custom sshd_config to disable MaxStartups and PerSourcePenalties
      - ./ssh/sshd_config:/etc/ssh/sshd_config:ro
    ports:
      - "2222:2222"
    networks:
      - monitored_net

  mysql_server:
    image: mysql:8.0
    container_name: mysql_server
    # This acts as a honeypot/vulnerable service to demonstrate Application-layer 
    # Deep Packet Inspection (DPI) and Data Exfiltration detection.
    environment:
      - MYSQL_ROOT_PASSWORD=rootpassword
      - MYSQL_DATABASE=company_db
      - MYSQL_USER=app_user
      - MYSQL_PASSWORD=app_password
    command: --default-authentication-plugin=mysql_native_password --ssl=0 --tls_version=''
    volumes:
      # We mount an initialization script to create a dummy table with data
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "3306:3306"
    networks:
      - monitored_net

  dns_server:
    image: ubuntu/bind9:latest
    container_name: dns_server
    # This acts as a honeypot/vulnerable service to demonstrate Covert Channels
    # and DNS Tunneling data exfiltration detection.
    environment:
      - BIND9_USER=root
    ports:
      # Map to a non-standard port on the host to avoid conflicts with systemd-resolved
      - "5353:53/udp"
      - "5353:53/tcp"
    networks:
      - monitored_net

  filebeat:
    image: docker.elastic.co/beats/filebeat:9.3.1
    container_name: filebeat
    user: root
    volumes:
      - ./beats/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - ./logs/nginx:/var/log/nginx:ro
      - ./logs/ssh:/var/log/ssh:ro
      - ./beats/data:/usr/share/filebeat/data
    depends_on:
      - kafka
      - monitored_host
    networks:
      - pipeline_net
      - monitored_net

  packetbeat:
    image: docker.elastic.co/beats/packetbeat:9.3.1
    container_name: packetbeat
    user: root
    network_mode: host
    extra_hosts:
      - "kafka:172.21.0.2"
    volumes:
      - ./beats/packetbeat.yml:/usr/share/packetbeat/packetbeat.yml
    cap_add:
      - NET_ADMIN
      - NET_RAW
    depends_on:
      - kafka
      - monitored_host
      - mysql_server