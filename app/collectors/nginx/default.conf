server {
    listen 80;
    server_name localhost;

    # Include dynamic blocklist generated by the Incident Response service
    include /etc/nginx/conf.d/shared/*.conf;

    # Home page
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ =404;
    }

    # Mock Login endpoint (Accepts POST, returns 401 Unauthorized by default to simulate failure)
    location /login {
        default_type text/plain;
        if ($request_method = POST) {
            return 401 "Invalid credentials";
        }
        return 405 "Method Not Allowed";
    }

    # Mock Search endpoint
    location /search {
        default_type text/plain;
        return 200 "Search results for your query...";
    }

    # Mock Download endpoint
    location /download {
        default_type text/plain;
        return 200 "File download started...";
    }

    # Mock About page
    location /about {
        default_type text/plain;
        return 200 "About our company...";
    }

    # Mock Contact page
    location /contact {
        default_type text/plain;
        return 200 "Contact us at admin@example.com";
    }
}