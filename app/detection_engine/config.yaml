app:
  name: "detection-engine"
  environment: "development"
  log_level: "DEBUG"

kafka:
  bootstrap_servers: "kafka:9092"
  group_id: "detection-engine-group"
  topics:
    consume:
      - "raw.logs"
      - "raw.packets"
    produce_signatures: "alerts.signatures"
    produce_anomalies: "alerts.anomalies"

elasticsearch:
  hosts: ["http://elasticsearch:9200"]
  alert_index: "alerts-detection"

ml:
  anomaly_threshold: 0.85 # Score above which an alert is generated (0.0 to 1.0)
  window_size_seconds: 60 # How long (in seconds) the FeatureExtractor remembers an IP's past requests to calculate rates (e.g. error_rate over the last 60s)
  warmup_observations: 180 # Number of events to process before allowing anomaly alerts to fire
