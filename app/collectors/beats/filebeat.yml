logging.level: debug
logging.selectors: ["kafka","*"]

filebeat.inputs:
  - type: filestream
    id: nginx-logs
    enabled: true
    paths:
      - /var/log/nginx/*.log
    ignore_older: 24h        # stop harvesting files older than 24h
    clean_inactive: 25h       # remove state for files inactive > 25h
    scan_frequency: 10s       # check files every 10s
    tail_files: true


output.kafka:
  hosts: ["kafka:9092"]
  topic: "raw.logs"
  required_acks: 1
  compression: gzip
  max_message_bytes: 1000000
  retries: 3
  retry.backoff: 1s

processors:
  - drop_event:
      when:
        or:
          # 1. Drop requests for static assets (images, stylesheets, scripts)
          - regexp:
              message: '(?i)\.(css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2)(\s|\?)'
              
          # 2. Drop common health checks or empty root pings
          - regexp:
              message: '(?i)(GET /health |GET /ping |GET / HTTP/1\.[01]" 200)'
              
          # 3. Drop internal Docker/Kubernetes health check User-Agents
          - regexp:
              message: '(?i)(kube-probe|docker-healthcheck)'